{% extends 'user/shared/base.html' %}
{% load static %}

{% block content %}
<div style="display:flex;align-items:center;justify-content:center;min-height:60vh;">
  <div style="text-align:center;max-width:440px;">

    <!-- Animated checkmark -->
    <div style="
      width: 90px; height: 90px;
      border-radius: 50%;
      background: rgba(0,229,192,0.1);
      border: 2px solid rgba(0,229,192,0.4);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 28px;
      animation: pulse 2s ease infinite;
    ">
      <i class="mdi mdi-check-circle" style="font-size: 44px; color: var(--teal);"></i>
    </div>

    <h2 style="
      font-family: 'Rajdhani', sans-serif;
      font-size: 32px;
      font-weight: 700;
      color: var(--teal);
      letter-spacing: 1px;
      margin-bottom: 10px;
    ">Payment Successful!</h2>

    <p style="color: var(--text-muted); font-size: 15px; line-height: 1.6; margin-bottom: 32px;">
      Your wallet has been recharged. You can now book parking slots across all SmartPark locations.
    </p>

    <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
      <a href="{% url 'userhome' %}" class="sp-btn sp-btn-primary">
        <i class="mdi mdi-view-dashboard"></i>
        Go to Dashboard
      </a>
      <a href="{% url 'available_slots' %}" class="sp-btn" style="background:rgba(79,141,255,0.1);color:var(--accent);border:1px solid rgba(79,141,255,0.25);">
        <i class="mdi mdi-parking"></i>
        Find Parking
      </a>
    </div>

  </div>
</div>

<style>
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(0,229,192,0.3); }
    50% { box-shadow: 0 0 0 14px rgba(0,229,192,0); }
  }
</style>
{% endblock %}

{% extends 'admin/shared/base.html' %}
{% load static %}
{% block content %}
<div class="sp-page-header">
  <h1>Add Location</h1>
  <div class="sp-header-line"></div>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start;max-width:860px;">
  <div class="sp-card">
    <div class="sp-card-title">New Location</div>
    <form method="POST">
      {% csrf_token %}
      <div class="form-field">
        {{ form.location.label_tag }}
        {{ form.location }}
      </div>
      <button type="submit" class="sp-btn sp-btn-primary" style="margin-top:6px;">
        <i class="mdi mdi-map-marker-plus"></i> Save Location
      </button>
    </form>
  </div>
  <div class="sp-card" style="background:rgba(0,229,192,0.03);">
    <div class="sp-card-title" style="color:var(--text-muted);">Quick Links</div>
    <a href="{% url 'view_locations' %}" class="sp-btn sp-btn-secondary" style="width:100%;justify-content:center;">
      <i class="mdi mdi-map-marker-multiple"></i> View All Locations
    </a>
  </div>
</div>
{% endblock content %}

{% extends 'mall/shared/base.html' %}
{% load static %}
{% block name %}{{ uname }}{% endblock name %}

{% block styles %}
<style>
  .hero-banner {
    position: relative; overflow: hidden;
    background: linear-gradient(135deg, #09183a 0%, #0a1f40 60%, #04111e 100%);
    border: 1px solid var(--border); border-radius: 14px;
    padding: 36px 40px; margin-bottom: 24px;
  }
  .hero-banner::before {
    content: ''; position: absolute; top: -80px; right: -80px;
    width: 300px; height: 300px;
    background: radial-gradient(circle, rgba(79,141,255,0.13) 0%, transparent 70%);
    pointer-events: none;
  }
  .hero-banner::after {
    content: ''; position: absolute; inset: 0;
    background-image: linear-gradient(rgba(79,141,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(79,141,255,0.03) 1px, transparent 1px);
    background-size: 44px 44px; pointer-events: none;
  }
  .hero-tag { font-size: 10px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--blue); margin-bottom: 6px; position: relative; z-index: 1; }
  .hero-banner h1 { font-family: 'Rajdhani', sans-serif; font-size: 30px; font-weight: 700; color: var(--text-main); position: relative; z-index: 1; margin-bottom: 4px; }
  .hero-banner h1 span { color: var(--blue); }
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
  .stat-card {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px;
    padding: 22px; position: relative; overflow: hidden;
    transition: border-color 0.2s, transform 0.2s;
  }
  .stat-card:hover { border-color: rgba(79,141,255,0.3); transform: translateY(-2px); }
  .stat-glow { position: absolute; top: -40px; right: -40px; width: 120px; height: 120px; border-radius: 50%; pointer-events: none; background: radial-gradient(circle, rgba(79,141,255,0.13) 0%, transparent 70%); }
  .stat-icon { width: 40px; height: 40px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 18px; margin-bottom: 13px; background: rgba(79,141,255,0.11); color: var(--blue); }
  .stat-value { font-family: 'Rajdhani', sans-serif; font-size: 32px; font-weight: 700; line-height: 1; color: var(--teal); }
  .stat-label { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted); margin-top: 5px; }
  .stat-link { position: absolute; bottom: 16px; right: 16px; width: 27px; height: 27px; border-radius: 50%; background: rgba(255,255,255,0.05); display: flex; align-items: center; justify-content: center; color: var(--text-muted); transition: all 0.16s; }
  .stat-card:hover .stat-link { background: rgba(79,141,255,0.16); color: var(--blue); }
</style>
{% endblock %}

{% block content %}
<div class="hero-banner">
  <div class="hero-tag">Mall Dashboard</div>
  <h1>Welcome, <span>{{ uname }}</span></h1>
</div>

<div class="stat-grid">
  <div class="stat-card">
    <div class="stat-glow"></div>
    <div class="stat-icon"><i class="mdi mdi-cash-multiple"></i></div>
    <div class="stat-value">₹ {{ total }}</div>
    <div class="stat-label">Total Revenue</div>
    <a href="{% url 'transaction_history' %}" class="stat-link"><i class="mdi mdi-arrow-right"></i></a>
  </div>
</div>
{% endblock content %}
